<!doctype html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate"><meta name="robots" content="noindex,nofollow">
<title>Sombra oc49 — Código × Sonnet</title>
<style>
  :root { --bg:#0F141B; --card:#151C25; --line:#263140; --ink:#E8ECF2; --soft:#AEB6C4; --mute:#7D8698;
          --red:#F04747; --green:#51CF66; --amber:#E8B04B; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font:14px/1.55 "IBM Plex Mono", ui-monospace, Menlo, monospace; padding:24px; }
  h1 { font-size:16px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px; }
  .sub { color:var(--mute); font-size:11px; margin-bottom:20px; }
  .placar { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:24px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 16px; min-width:120px; }
  .kpi b { display:block; font-size:22px; }
  .kpi span { color:var(--mute); font-size:10px; text-transform:uppercase; letter-spacing:.08em; }
  .caso { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
  .caso.div { border-left:3px solid var(--red); }
  .caso.conc { border-left:3px solid var(--green); opacity:.75; }
  .head { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .nf { font-weight:700; }
  .tag { font-size:10px; padding:2px 8px; border-radius:10px; border:1px solid var(--line); color:var(--soft); }
  .tag.d { border-color:var(--red); color:var(--red); }
  .tag.c { border-color:var(--green); color:var(--green); }
  .cols { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  @media (max-width:980px){ .cols { grid-template-columns:1fr; } }
  .col { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:12px; }
  .col h4 { font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--mute); margin-bottom:6px; }
  .acao { font-size:15px; font-weight:700; }
  .obs { color:var(--soft); margin-top:6px; white-space:pre-wrap; word-break:break-word; }
  .vered { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { background:var(--bg); color:var(--soft); border:1px solid var(--line); border-radius:6px;
           padding:5px 12px; font:inherit; font-size:11px; cursor:pointer; }
  button:hover { border-color:var(--soft); color:var(--ink); }
  button.on { border-color:var(--amber); color:var(--amber); font-weight:700; }
  .err { color:var(--red); padding:20px; }
  .muted { color:var(--mute); font-size:11px; }
</style>
</head>
<body>
<h1>Sombra oc49 — Código × Sonnet</h1>
<div class="sub">Fase sombra (Caio 27/08, 2 dias): a decisão REAL continua sendo a do código; o Sonnet lê o mesmo contexto em paralelo. Marque quem acertou em cada divergência. Abaixo: feedbacks OBRIGATÓRIOS dos operadores nas 49 que o agente não reconheceu.</div>
<div id="app">Carregando…</div>
<script>
const SB = "https://xjbycvscljqoqpjkmevb.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhqYnljdnNjbGpxb3FwamttZXZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczOTQyNjksImV4cCI6MjA5Mjk3MDI2OX0.oHvQxrElBGq4RndfpsbhVUnw6Tw64YES8xNZhPCq2f0";
const K = new URLSearchParams(location.search).get("k");
const USD_IN = 3/1e6, USD_OUT = 15/1e6, BRL = 5.4;
async function rpc(fn, body){
  const r = await fetch(SB+"/rest/v1/rpc/"+fn, {method:"POST",
    headers:{apikey:ANON, Authorization:"Bearer "+ANON, "Content-Type":"application/json"},
    body: JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
function esc(s){ return String(s??"").replace(/[<>&]/g, c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c])); }
function colCodigo(c){
  return `<div class="col"><h4>Código (sugestão)</h4>
    <div class="acao">oc ${esc(c.proposta_destacada ?? "—")}</div>
    <div class="muted">caso: ${esc(c.caso ?? "?")} · conf ${esc(c.confianca ?? "?")}${c.template ? " · "+esc(c.template):""}</div>
    <div class="obs">${esc((c.observacao||"").slice(0,400))}</div></div>`;
}
function colReal(r){
  if(!r) return `<div class="col"><h4>Feito na realidade</h4><div class="muted">— nada ainda</div></div>`;
  if(r.aguardar) return `<div class="col"><h4>Feito na realidade</h4><div class="acao">aguardar</div><div class="muted">${esc(r.em||"")}</div></div>`;
  return `<div class="col"><h4>Feito na realidade</h4><div class="acao">oc ${esc(r.oc)}</div><div class="muted">SSW confirmou · ${esc(r.em||"")}</div></div>`;
}
function colIa(i){
  if(i.erro) return `<div class="col"><h4>Sonnet</h4><div class="err">falhou: ${esc(i.erro)}</div></div>`;
  return `<div class="col"><h4>Sonnet</h4>
    <div class="acao">oc ${esc(i.acao_sugerida_oc ?? "—")}${i.enviar_email_cliente?" + e-mail":""}</div>
    <div class="muted">origem_49: ${esc(i.origem_da_49)} · conf ${esc(i.confianca)}</div>
    <div class="obs">${esc((i.leitura_do_contexto||"").slice(0,400))}</div>
    ${i.alerta_divergencia?`<div class="obs" style="color:var(--amber)">⚠ ${esc(i.alerta_divergencia)}</div>`:""}
    ${i.texto_ssw_sugerido?`<div class="obs muted">SSW: ${esc(i.texto_ssw_sugerido.slice(0,200))}</div>`:""}</div>`;
}
async function veredito(id, v, el){
  try { await rpc("monitor_sombra_veredito", {p_token:K, p_id:id, p_veredito:v});
    el.closest(".vered").querySelectorAll("button").forEach(b=>b.classList.remove("on"));
    el.classList.add("on");
  } catch(e){ alert("erro: "+e.message); }
}
async function main(){
  const app = document.getElementById("app");
  if(!K){ app.innerHTML = '<div class="err">Sem token (?k=...)</div>'; return; }
  let d;
  try { d = await rpc("monitor_sombra_oc49", {p_token:K}); }
  catch(e){ app.innerHTML = '<div class="err">'+esc(e.message)+"</div>"; return; }
  const p = d.placar || {};
  const usd = (p.tokens_in||0)*USD_IN + (p.tokens_out||0)*USD_OUT;
  const F = d.feedbacks || {};
  const CAT_ROTULO = {cobranca_retorno:"Cobrança de retorno", pendencia_docs_indenizacao:"Docs da indenização",
    instrucao_operacional:"Instrução operacional", devolucao_retorno:"Devolução/retorno",
    oc_lancada_errada:"49 lançada errada", outro:"Outro"};
  const cats = Object.entries(F.por_categoria||{}).sort((a,b)=>b[1]-a[1]);
  const maxCat = Math.max(1, ...cats.map(c=>c[1]));
  const mi = F.match_ia||{};
  const M = d.metricas_49 || {};
  const serie = (M.serie_diaria||[]);
  const maxT = Math.max(1, ...serie.map(x=>x.total||0));
  const mHtml = `
  <h1 style="margin-top:32px">Métrica-mãe: % das 49 sem sugestão</h1>
  <div class="sub">Baseline pré-mudanças: <b style="color:var(--red)">${M.baseline_pct||"?"}%</b> (${esc(M.baseline_janela||"")}). Objetivo: derrubar drasticamente com os casos do time + regras A/B + automação da 43 v2.</div>
  <div class="caso">
    ${serie.map(x=>`<div style="display:flex;align-items:center;gap:8px;margin:2px 0">
      <span style="width:52px;font-size:11px;color:var(--mute)">${esc(x.dia)}</span>
      <div style="flex:1;background:var(--bg);border:1px solid var(--line);border-radius:4px;height:14px;position:relative">
        <div style="width:${Math.round(100*(x.total||0)/maxT)}%;background:var(--line);height:100%;border-radius:3px"></div>
        <div style="position:absolute;top:0;left:0;width:${Math.round((x.pct||0)*(x.total||0)/maxT)}%;background:${(x.pct||0)>40?"var(--red)":(x.pct||0)>25?"var(--amber)":"var(--green)"};height:100%;border-radius:3px"></div>
      </div>
      <b style="width:110px;text-align:right;font-size:12px">${x.pct==null?"—":x.pct+"%"} <span class="muted">(${x.sem_sug}/${x.total})</span></b></div>`).join("")}
    <div class="muted" style="margin-top:8px">Casos novos em 7d: ${Object.entries(M.casos_novos_7d||{}).map(([k,v])=>esc(k)+"="+v).join(" · ")||"nenhum ainda"}</div>
  </div>`;
  const fbHtml = `
  <h1 style="margin-top:32px">Feedbacks das 49 não reconhecidas</h1>
  <div class="sub">Obrigatório desde 27/08 — cada registro é um caso que o agente não entendeu, descrito por quem resolveu. A ação aprovada em seguida é a correção (capturada sozinha).</div>
  <div class="placar">
    <div class="kpi"><b>${F.total||0}</b><span>casos descritos</span></div>
    <div class="kpi"><b>${mi.comparaveis?Math.round(100*(mi.bateram||0)/mi.comparaveis)+"%":"—"}</b><span>Sonnet leu igual (${mi.bateram||0}/${mi.comparaveis||0})</span></div>
    <div class="kpi"><b>${(F.por_recorrencia||{}).geral||0}</b><span>padrões gerais</span></div>
    <div class="kpi"><b>${(F.por_recorrencia||{}).cliente||0}</b><span>padrões de cliente</span></div>
  </div>
  <div class="caso"><h4 style="font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);margin-bottom:8px">Por categoria (P1)</h4>
    ${cats.map(([k,n])=>`<div style="display:flex;align-items:center;gap:8px;margin:3px 0">
      <span style="width:180px;font-size:11px;color:var(--soft)">${CAT_ROTULO[k]||k}</span>
      <div style="flex:1;background:var(--bg);border:1px solid var(--line);border-radius:4px;height:14px">
        <div style="width:${Math.round(100*n/maxCat)}%;background:var(--amber);height:100%;border-radius:3px"></div></div>
      <b style="width:32px;text-align:right">${n}</b></div>`).join("") || '<span class="muted">nenhum ainda</span>'}
  </div>
  ${(F.ultimos||[]).map(f=>`
    <div class="caso">
      <div class="head"><span><span class="nf">NF ${esc(f.nf)}</span> <span class="muted">${esc(f.em)} · ${esc(f.operador||"?")}</span></span>
        <span class="tag">${esc(CAT_ROTULO[f.categoria]||f.categoria)}${f.categoria_outro?": "+esc(f.categoria_outro):""} · ${esc(f.recorrencia)}</span></div>
      <div class="obs">“${esc(f.frase)}”</div>
      <div class="muted" style="margin-top:4px">info estava em: ${(f.fontes||[]).join(", ")||"—"}</div>
    </div>`).join("")}`;
  const julgadas = (p.vereditos_ia||0)+(p.vereditos_codigo||0)+(p.vereditos_empate||0)+(p.vereditos_ambos_errados||0);
  app.innerHTML = `
  <div class="placar">
    <div class="kpi"><b>${p.total||0}</b><span>decisões</span></div>
    <div class="kpi"><b>${p.divergem||0}</b><span>divergem</span></div>
    <div class="kpi"><b>${p.concordam||0}</b><span>concordam</span></div>
    <div class="kpi"><b>${p.vereditos_ia||0} × ${p.vereditos_codigo||0}</b><span>IA × código (${julgadas} julgadas)</span></div>
    <div class="kpi"><b>R$ ${(usd*BRL).toFixed(2)}</b><span>custo (${((p.tokens_in||0)/1000).toFixed(0)}k in / ${((p.tokens_out||0)/1000).toFixed(0)}k out)</span></div>
    <div class="kpi"><b>${p.ia_falhou||0}</b><span>IA falhou</span></div>
  </div>
  ${(d.casos||[]).map(c=>`
    <div class="caso ${c.diverge===true?"div":c.diverge===false?"conc":""}">
      <div class="head">
        <span><span class="nf">NF ${esc(c.nf)}</span> <span class="muted">${esc(c.em)}</span></span>
        <span class="tag ${c.diverge===true?"d":c.diverge===false?"c":""}">${c.diverge===true?"DIVERGE":c.diverge===false?"concordam":"ia falhou"}</span>
      </div>
      <div class="cols">${colCodigo(c.codigo||{})}${colIa(c.ia||{})}${colReal(c.real)}</div>
      <div class="vered"><span class="muted">quem acertou?</span>
        ${["ia","codigo","empate","ambos_errados"].map(v=>
          `<button class="${c.veredito===v?"on":""}" onclick="veredito(${c.id},'${v}',this)">${v.replace("_"," ")}</button>`).join("")}
      </div>
    </div>`).join("") || '<div class="muted">Nenhum caso ainda — a sombra grava a cada decisão da oc 49.</div>'}
  ${mHtml}
  ${fbHtml}`;
}
main(); setInterval(main, 120000);
</script>
</body>
</html>
