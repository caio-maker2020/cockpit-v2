[functions.agente-priorizador-ai]
verify_jwt = false

[functions.agente-monitor-efetividade-ai]
verify_jwt = false

[functions.agente-insights-globais-ai]
verify_jwt = false

[functions.sugerir-cobranca-ai]
verify_jwt = false

[functions.disparar-cobranca-escalonada]
verify_jwt = false

[functions.atualizar-batch-prioridades-ai]
verify_jwt = false

# Caio 2026-05-22: receptor de webhook SSW2181. Endpoint público pra SSW
# Sistemas postar ocorrências. Auth via header X-SSW-Secret (env
